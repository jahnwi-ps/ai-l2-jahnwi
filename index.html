<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Wizard | Your AI Itinerary Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #161625;
            --accent: #7c4dff;
            --text: #e0e0e0;
            --wizard-gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(124, 77, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
        }

        header {
            padding: 2rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-weight: 600;
            background: linear-gradient(45deg, var(--wizard-gold), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #888;
            margin-top: 0.5rem;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 1.2rem;
            border-radius: 1.5rem;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            animation: fadeIn 0.4s ease-out;
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 0.2rem;
        }

        .wizard-message {
            align-self: flex-start;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 0.2rem;
            position: relative;
        }

        .wizard-message::before {
            content: '🪄';
            position: absolute;
            left: -30px;
            top: 10px;
        }

        .input-area {
            padding: 2rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        input {
            flex: 1;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.2rem;
            border-radius: 1rem;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #9067ff;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        img.dog-pic {
            max-width: 100%;
            border-radius: 1rem;
            margin-top: 1rem;
            border: 2px solid var(--accent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
        }

        /* Scrollbar */
        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Weekend Wizard</h1>
        <p class="subtitle">Magical Itineraries, Instant Results</p>
    </header>

    <div id="chat-container">
        <div class="message wizard-message">Greetings, traveler! Where shall we plan your next adventure? (Try: "Plan a mystery day in Paris")</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your request here..." autocomplete="off">
        <button id="send-btn">Cast Spell</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Plain text: escape it, then show **bold** as bold
        function formatText(str) {
            return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        }

        // A URL becomes a link, or an image for dog pics. Trailing punctuation such as
        // "." or ")" is kept out of the URL so the address still works.
        function formatUrl(raw) {
            const [, url, trail] = raw.match(/^(.*?)([.,;:!?)\]*]*)$/);
            const safeUrl = escapeHtml(url);
            const html = (/\.(jpe?g|gif|png)$/i.test(url) || url.includes('dog.ceo'))
                ? `<br><img src="${safeUrl}" class="dog-pic" alt="Dog Picture">`
                : `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--wizard-gold)">${safeUrl}</a>`;
            return html + escapeHtml(trail);
        }

        function addMessage(text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user-message' : 'wizard-message'}`;

            // Unwrap markdown links/images like ![dog](url) to the bare url, then split out URLs.
            // Every piece is escaped, so model/tool output can't inject HTML.
            const plain = String(text ?? '').replace(/!?\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/g, '$1');
            const parts = plain.split(/(https?:\/\/[^\s<>"'`]+)/g);
            msg.innerHTML = parts.map((part, i) => (i % 2 ? formatUrl(part) : formatText(part))).join('');
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        let isLoading = false;

        async function handleChat() {
            const message = userInput.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            addMessage(message, true);
            userInput.value = '';

            const typing = document.createElement('div');
            typing.className = 'message wizard-message typing';
            typing.innerText = 'The Wizard is consulting the stars...';
            chatContainer.appendChild(typing);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                chatContainer.removeChild(typing);
                addMessage(data.reply || "The Wizard had nothing to say. Please try again.");
            } catch (err) {
                chatContainer.removeChild(typing);
                addMessage("Alas! My crystal ball is cloudy. Please try again.");
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleChat);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });
    </script>
</body>
</html>
